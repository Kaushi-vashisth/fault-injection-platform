<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter platform.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
    time_key timestamp_utc
    time_format %Y-%m-%dT%H:%M:%SZ
  </parse>
</filter>

<filter platform.**>
  @type record_transformer
  <record>
    container_name ${tag_suffix[1]}
    collected_at ${time}
  </record>
</filter>

<match platform.service_*>
  @type mongo
  host mongodb
  port 27017
  database platform_db
  collection log_entries

  <buffer>
    @type memory
    flush_interval 2s
    chunk_limit_size 8m
    retry_max_times 5
    retry_wait 1s
  </buffer>
</match>

<match platform.prometheus>
  @type null
</match>

<match platform.grafana>
  @type null
</match>

<match **>
  @type stdout
</match>